# App Info
spring.application.name=profitas-backend

# Database Configuration (Uses env variables, falls back to local default)
spring.datasource.url=jdbc:postgresql://localhost:5432/profitas_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Security / JWT (No real secrets hardcoded!)
jwt.secret=${JWT_SECRET:defaultSecretKeyThatIsAtLeast32BytesLongForSecurity}



