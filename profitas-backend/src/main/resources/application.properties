# App Info
spring.application.name=profitas-backend

# Database (override with env vars in any real environment)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/profitas_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Schema management: creates/updates tables on startup.
# For production, switch to "validate" and manage the schema with Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# JWT. JWT_SECRET is REQUIRED (no default on purpose). Must be at least 32 characters.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Optional bootstrap admin. Created on startup if both are set and the email does not exist yet.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Business rules
app.loan.max-ltv=0.70
app.loan.interest-rate=11.00
app.exit.haircut-percent=3.00
# true  = instant exit settles immediately (original intent of the service)
# false = request stays PENDING until an admin approves and settles it
app.exit.auto-settle=${EXIT_AUTO_SETTLE:true}
